<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1줄 1장 PPT</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Noto Sans KR', sans-serif; background: #f4f5f7; color: #222; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #666; font-size: 14px; margin: 0 0 16px; line-height: 1.6; }
  .keys { display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .keys span { display: inline-flex; align-items: center; gap: 4px; }
  kbd { font-family: inherit; font-size: 13px; background: #fff; border: 1px solid #ccc; border-bottom-width: 2px; border-radius: 6px; padding: 1px 7px; color: #333; }
  .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px; }
  .card h2 { font-size: 16px; margin: 0 0 10px; }
  input[type=text], textarea { width: 100%; font: inherit; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
  textarea { height: 300px; resize: vertical; line-height: 1.7; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .count { color: #666; font-size: 14px; margin-left: auto; }
  button { font: inherit; font-size: 15px; padding: 9px 14px; border: 0; border-radius: 8px; background: #e5e7eb; cursor: pointer; }
  button:hover { filter: brightness(.95); }
  button.primary { background: #2563eb; color: #fff; }
  button.danger { background: #fee2e2; color: #b91c1c; padding: 6px 10px; font-size: 13px; }
  label.chk { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .saved-list { list-style: none; padding: 0; margin: 0; }
  .saved-list li { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #eee; }
  .saved-list .name { flex: 1; cursor: pointer; }
  .saved-list .name small { color: #888; margin-left: 6px; }
  .empty { color: #888; font-size: 14px; }
  .help { font-size: 13px; color: #666; line-height: 1.7; margin: 8px 0 0; }
  code { background: #eef; padding: 1px 5px; border-radius: 4px; }

  /* 발표 화면 */
  #stage { position: fixed; inset: 0; background: #fff; display: none; align-items: center; justify-content: center; cursor: pointer; user-select: none; z-index: 10; }
  #stage.on { display: flex; }
  #stage .box { width: 88vw; height: 80vh; }
  #counter { position: fixed; right: 18px; bottom: 12px; font-size: 14px; color: #bbb; }
  #stage.title-mode { background: #2563eb; }
  #stage.title-mode .slide-text { color: #fff; font-weight: 700; }
  #stage.end-mode { background: #dc2626; }
  #stage.end-mode .slide-text { color: #fff; font-weight: 700; }

  .box { display: flex; align-items: center; justify-content: center; }
  .slide-text {
    width: 100%; text-align: center; line-height: 1.35; font-weight: 500; color: #111;
    word-break: keep-all; overflow-wrap: break-word; text-wrap: balance; white-space: pre-line;
  }
  .slide-text .hl { color: #dc2626; }

  /* PDF(인쇄)용 */
  #printArea { position: absolute; left: -100000px; top: 0; }
  .pslide { width: 297mm; height: 209mm; display: flex; align-items: center; justify-content: center; background: #fff; }
  .pslide .box { width: 260mm; height: 170mm; }
  @media print {
    @page { size: A4 landscape; margin: 0; }
    body { background: #fff; }
    .wrap, #stage { display: none !important; }
    #printArea { position: static; }
    .pslide { break-after: page; page-break-after: always; }
    .pslide:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>1줄 1장 PPT</h1>
  <p class="sub keys"><span><kbd>클릭</kbd><kbd>Space</kbd><kbd>→</kbd> 다음</span><span><kbd>←</kbd> 이전</span><span><kbd>Esc</kbd> 종료</span></p>

  <div class="card">
    <h2>내용 입력</h2>
    <input type="text" id="title" placeholder="제목 (예: 3단원 정전기)">
    <div style="height:8px"></div>
    <textarea id="text" placeholder="전자를 얻으면 띠는 전기
전자를 잃으면 띠는 전기
같은 종류의 전기끼리 작용하는 힘"></textarea>
    <div class="row" style="margin-top:6px">
      <button id="btnHl" style="color:#dc2626;font-weight:700">강조</button>
      <span style="font-size:13px;color:#666">글자를 드래그한 뒤 누르면 빨간색 강조 (다시 누르면 해제)</span>
    </div>
    <p class="help">· 줄바꿈 위치를 직접 바꾸려면 <code>//</code> 를 넣으세요. 예) <code>전자를 얻으면 // 띠는 전기</code></p>
    <div class="row">
      <label class="chk"><input type="checkbox" id="shuffle"> 순서 섞기</label>
      <span class="count" id="count">0장</span>
    </div>
    <div class="row">
      <button class="primary" id="btnStart">▶ 시작</button>
      <button id="btnPdf">PDF로 저장</button>
      <button id="btnSave">저장</button>
      <button id="btnNew">새로 쓰기</button>
    </div>
  </div>

  <div class="card">
    <h2>저장된 목록</h2>
    <ul class="saved-list" id="savedList"></ul>
    <div class="row">
      <button id="btnExport">백업 파일 내보내기</button>
      <button id="btnImport">백업 파일 불러오기</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
    <p class="help">다른 컴퓨터에서 쓰거나 인터넷 기록 삭제에 대비하려면 백업 파일을 내보내 두세요.</p>
  </div>
</div>

<div id="stage"><div class="box"><div class="slide-text" id="slideText"></div></div><div id="counter"></div></div>
<div id="printArea"></div>

<script>
const KEY_SETS = 'lineSlides.sets';
const KEY_DRAFT = 'lineSlides.draft';
const $ = id => document.getElementById(id);

/* ---------- 저장소 ---------- */
function loadSets() {
  try { return JSON.parse(localStorage.getItem(KEY_SETS)) || []; } catch (e) { return []; }
}
function saveSets(sets) {
  try { localStorage.setItem(KEY_SETS, JSON.stringify(sets)); return true; }
  catch (e) { alert('저장에 실패했습니다. (브라우저 저장소를 사용할 수 없음)'); return false; }
}
function saveDraft() {
  try { localStorage.setItem(KEY_DRAFT, JSON.stringify({ title: $('title').value, text: $('text').value, shuffle: $('shuffle').checked })); } catch (e) {}
}
function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY_DRAFT));
    if (d) { $('title').value = d.title || ''; $('text').value = d.text || ''; $('shuffle').checked = !!d.shuffle; }
  } catch (e) {}
}

function renderList() {
  const ul = $('savedList');
  const sets = loadSets().sort((a, b) => b.updated - a.updated);
  ul.innerHTML = '';
  if (!sets.length) { ul.innerHTML = '<li class="empty">저장된 내용이 없습니다.</li>'; return; }
  sets.forEach(s => {
    const li = document.createElement('li');
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = s.title;
    const small = document.createElement('small');
    small.textContent = parseLines(s.text).length + '장 · ' + new Date(s.updated).toLocaleDateString('ko-KR');
    name.appendChild(small);
    name.onclick = () => {
      $('title').value = s.title; $('text').value = s.text;
      updateCount(); saveDraft(); window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    const del = document.createElement('button');
    del.className = 'danger'; del.textContent = '삭제';
    del.onclick = () => {
      if (!confirm('"' + s.title + '"을(를) 삭제할까요?')) return;
      saveSets(loadSets().filter(x => x.id !== s.id)); renderList();
    };
    li.append(name, del);
    ul.appendChild(li);
  });
}

$('btnSave').onclick = () => {
  const title = $('title').value.trim();
  const text = $('text').value;
  if (!title) { alert('제목을 입력하세요.'); $('title').focus(); return; }
  if (!parseLines(text).length) { alert('내용을 입력하세요.'); return; }
  const sets = loadSets();
  const same = sets.find(s => s.title === title);
  if (same) {
    if (!confirm('같은 제목이 있습니다. 덮어쓸까요?')) return;
    same.text = text; same.updated = Date.now();
  } else {
    sets.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title, text, updated: Date.now() });
  }
  if (saveSets(sets)) { renderList(); alert('저장했습니다.'); }
};

$('btnNew').onclick = () => {
  if ($('text').value.trim() && !confirm('입력창을 비울까요? (저장하지 않은 내용은 사라집니다)')) return;
  $('title').value = ''; $('text').value = ''; updateCount(); saveDraft();
};

$('btnExport').onclick = () => {
  if (!loadSets().length) { alert('저장된 내용이 없습니다.\n제목을 쓰고 [저장] 버튼을 먼저 누른 뒤 내보내기 하세요.'); return; }
  const blob = new Blob([JSON.stringify(loadSets(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const fname = $('title').value.trim().replace(/[\\/:*?"<>|]/g, '_');
  a.download = (fname || '한줄슬라이드_백업_' + new Date().toISOString().slice(0, 10)) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
};
$('btnImport').onclick = () => $('importFile').click();
$('importFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const incoming = JSON.parse(r.result);
      if (!Array.isArray(incoming)) throw 0;
      const sets = loadSets();
      let added = 0;
      incoming.forEach(s => {
        if (!s || typeof s.title !== 'string' || typeof s.text !== 'string') return;
        const same = sets.find(x => x.title === s.title);
        if (same) { same.text = s.text; same.updated = s.updated || Date.now(); }
        else { sets.push({ id: s.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: s.title, text: s.text, updated: s.updated || Date.now() }); }
        added++;
      });
      saveSets(sets); renderList(); alert(added + '개를 불러왔습니다.');
    } catch (err) { alert('올바른 백업 파일이 아닙니다.'); }
    e.target.value = '';
  };
  r.readAsText(f);
};

/* ---------- 내용 처리 ---------- */
function parseLines(text) {
  return text.split('\n').map(s => s.trim()).filter(Boolean);
}
function fmt(line) {
  return line.split('//').map(s => s.trim()).join('\n');
}
/* *강조* 부분을 빨간 글씨로 표시 */
function render(el, line) {
  const parts = fmt(line).split('*');
  if (parts.length % 2 === 0) { const last = parts.pop(); parts[parts.length - 1] += '*' + last; }
  el.textContent = '';
  parts.forEach((p, i) => {
    if (!p) return;
    if (i % 2 === 1) { const s = document.createElement('span'); s.className = 'hl'; s.textContent = p; el.appendChild(s); }
    else el.appendChild(document.createTextNode(p));
  });
}
function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function getItems() {
  const items = parseLines($('text').value);
  return $('shuffle').checked ? shuffled(items) : items;
}
function updateCount() { $('count').textContent = parseLines($('text').value).length + '장'; }

/* 상자 안에 들어가는 가장 큰 글자 크기 찾기 */
function fit(el, box) {
  const maxByBox = Math.min(box.clientWidth, box.clientHeight) * 0.3;
  let lo = 10, hi = Math.max(12, Math.floor(maxByBox));
  el.style.fontSize = hi + 'px';
  if (el.scrollWidth <= el.clientWidth && el.offsetHeight <= box.clientHeight) return;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    el.style.fontSize = mid + 'px';
    if (el.scrollWidth <= el.clientWidth && el.offsetHeight <= box.clientHeight) lo = mid; else hi = mid;
  }
  el.style.fontSize = lo + 'px';
}

/* ---------- 발표 ---------- */
let deck = [], idx = -1;
let startTime = null, endTime = null, timerId = null;
const stage = $('stage'), slideText = $('slideText'), counter = $('counter');

function elapsedSec() {
  if (startTime === null) return 0;
  return ((endTime !== null ? endTime : Date.now()) - startTime) / 1000;
}
function updateCounter() {
  if (idx < 0 || idx >= deck.length) { counter.textContent = ''; return; }
  counter.textContent = (idx + 1) + ' / ' + deck.length + ' · ' + Math.floor(elapsedSec()) + '초';
}

function show() {
  stage.classList.toggle('title-mode', idx < 0);
  stage.classList.toggle('end-mode', idx >= deck.length);
  if (idx < 0) {
    slideText.textContent = fmt($('title').value.trim() || '시작');
    slideText.style.color = '';
  } else if (idx >= deck.length) {
    if (endTime === null) endTime = Date.now();
    slideText.textContent = '끝\n' + elapsedSec().toFixed(1) + '초';
    slideText.style.color = '';
  } else {
    render(slideText, deck[idx]);
    slideText.style.color = '';
  }
  updateCounter();
  fit(slideText, stage.querySelector('.box'));
}
function next() {
  if (idx >= deck.length) { closeStage(); return; }
  if (idx < 0) { startTime = Date.now(); endTime = null; }
  idx++; show();
}
function prev() {
  if (idx < 0) return;
  if (idx >= deck.length) endTime = null;
  idx--;
  if (idx < 0) { startTime = null; endTime = null; }
  show();
}

async function start() {
  deck = getItems();
  if (!deck.length) { alert('내용을 입력하세요.'); return; }
  idx = -1; startTime = null; endTime = null;
  clearInterval(timerId);
  timerId = setInterval(updateCounter, 250);
  try { await document.fonts.ready; } catch (e) {}
  stage.classList.add('on');
  try { if (stage.requestFullscreen) await stage.requestFullscreen(); } catch (e) {}
  show();
}
function closeStage() {
  clearInterval(timerId);
  stage.classList.remove('on');
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}

$('btnStart').onclick = start;
stage.addEventListener('click', next);
stage.addEventListener('contextmenu', e => { e.preventDefault(); prev(); });
document.addEventListener('keydown', e => {
  if (!stage.classList.contains('on')) return;
  if ([' ', 'ArrowRight', 'ArrowDown', 'Enter', 'PageDown'].includes(e.key)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'ArrowUp', 'Backspace', 'PageUp'].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === 'Escape') { closeStage(); }
});
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && stage.classList.contains('on')) { clearInterval(timerId); stage.classList.remove('on'); }
  else if (stage.classList.contains('on')) show();
});
window.addEventListener('resize', () => { if (stage.classList.contains('on')) show(); });

/* ---------- PDF ---------- */
$('btnPdf').onclick = async () => {
  const items = getItems();
  if (!items.length) { alert('내용을 입력하세요.'); return; }
  try { await document.fonts.ready; } catch (e) {}
  const area = $('printArea');
  area.innerHTML = '';
  items.forEach(t => {
    const p = document.createElement('div'); p.className = 'pslide';
    const b = document.createElement('div'); b.className = 'box';
    const s = document.createElement('div'); s.className = 'slide-text'; render(s, t);
    b.appendChild(s); p.appendChild(b); area.appendChild(p);
  });
  area.querySelectorAll('.pslide').forEach(p => fit(p.querySelector('.slide-text'), p.querySelector('.box')));
  const oldTitle = document.title;
  if ($('title').value.trim()) document.title = $('title').value.trim();
  window.print();
  document.title = oldTitle;
};

/* ---------- 강조 버튼 ---------- */
$('btnHl').addEventListener('mousedown', e => e.preventDefault()); // 버튼 클릭 시 선택 영역 유지
$('btnHl').onclick = () => {
  const ta = $('text');
  let st = ta.selectionStart, en = ta.selectionEnd;
  if (st === en) { alert('강조할 글자를 먼저 드래그해서 선택하세요.'); return; }
  const v = ta.value;
  let sel = v.slice(st, en);
  let rep;
  if (v[st - 1] === '*' && v[en] === '*') {            // 바깥에 * 가 있으면 해제
    st--; en++; rep = sel;
  } else if (sel.length > 2 && sel.startsWith('*') && sel.endsWith('*')) { // 선택 안에 * 가 있으면 해제
    rep = sel.slice(1, -1);
  } else {                                              // 강조 (줄마다 따로 감싸기)
    rep = sel.split('\n').map(s => s.trim() ? '*' + s + '*' : s).join('\n');
  }
  ta.focus();
  ta.setRangeText(rep, st, en, 'select');
  updateCount(); saveDraft();
};

/* ---------- 초기화 ---------- */
$('text').addEventListener('input', () => { updateCount(); saveDraft(); });
$('title').addEventListener('input', saveDraft);
$('shuffle').addEventListener('change', saveDraft);
loadDraft(); updateCount(); renderList();
</script>
</body>
</html>
